<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-aba">Produto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div class="logo">
        <img src="Imagens/logobranca-transparente (1).png" alt="Logo" width="700px" height="300px">
    </div>

    <div class="Categorias">
        <p>Aneis</p>
        <p>Brincos</p>
        <p>Colares</p>
        <p>Pulseiras</p>
        <p>Tiaras</p>
        <p>Relógios</p>
    </div>

    <div style="display:flex; justify-content:center; margin: 20px 0;">
        <input type="text" placeholder="Procurar" style="height: 40px; width: 500px; font-family: 'Jost', sans-serif;">
    </div>

    <p class="titulo-colecao" id="titulo-colecao">Produto:</p>

    <div class="container" id="area-produto">

        <div class="fotodoanel">
            <img id="imagem-produto" src="" alt="Produto" width="500px" height="500px">
        </div>

        <aside class="barra-lateral">
            <p id="nome-produto"></p>
            <p><strong id="preco-produto" style="font-size: 28px;"></strong></p>
            <p id="parcelas-produto" style="font-size: 18px; font-family: 'Jost', sans-serif;"></p>
            <p id="descricao-produto" class="descricao-produto"></p>

            <div class="secao-aro">
                <h3>Aro</h3>
                <div class="meus-aros">
                    <button>12</button>
                    <button>14</button>
                    <button>16</button>
                    <button>18</button>
                    <button>20</button>
                    <button>22</button>
                    <button>24</button>
                    <button>26</button>
                    <button>28</button>
                    <button>30</button>
                </div>
            </div>

            <div class="linha-sacola">
                <button class="botaosacola">Adicionar à sacola</button>
                <label class="favorito">
                    <input type="checkbox">
                    <span class="coracao">&#9825;</span>
                </label>
            </div>

        </aside>
    </div>
<script src="js/script.js"></script>
</body>
</html>
