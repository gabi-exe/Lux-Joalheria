<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Lux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class ="pagina-login">

    <div class="cartao-login">
        <div class="logo-login">
            <img src="Imagens/logobranca-transparente (1).png" alt="Lux Joias">
        </div>

        <h1>Acesse sua conta</h1>

        <div class="campo">
            <label for="Email">Email</label>
            <input type="text" id="Email" placeholder="Digite seu email">
        </div>

        <div class="campo">
            <label for="Senha">Senha</label>
            <input type="password" id="Senha" placeholder="Digite sua senha">
        </div>

        <button class="Botao-login">Iniciar sessão</button>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
